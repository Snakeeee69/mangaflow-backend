spring.application.name=puntos-service
server.port=8087

spring.datasource.url=jdbc:mysql://localhost:3306/mangaflow_puntos_db
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.error.include-message=always
server.error.include-binding-errors=always

# Configuracion Eureka: apunta al servidor de descubrimiento
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

pagos.service.url=${PAGOS_SERVICE_URL:http://pagos-service:8086}
personas.service.url=${PERSONAS_SERVICE_URL:http://personas-service:8081}